name: Auto Update Music Hierarchy

on:
  push:
    paths:
      - 'assets/music/**'

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate music JSON from folders
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const musicRootDir = path.join(".", "music");
          const musicList = [];

          function scanDir(currentPath, artist = "", album = "") 
          {
              if (!fs.existsSync(currentPath)) return;
          
              const entries = fs.readdirSync(currentPath, { withFileTypes: true });
          
              for (const entry of entries) 
              {
                  const fullPath = path.join(currentPath, entry.name);
          
                  if (entry.isDirectory()) 
                  {
                      if (!artist) 
                      {
                          scanDir(fullPath, entry.name, "");
                      } 
                      else if (!album) 
                      {
                          scanDir(fullPath, artist, entry.name);
                      } 
                      else 
                      {
                          scanDir(fullPath, artist, album);
                      }
                  } 
                  else if (entry.isFile() && entry.name.toLowerCase().endsWith(".mp3")) 
                  {
                      const baseName = path.basename(entry.name, path.extname(entry.name));
          
                      let cover = null;
                      const possibleCovers = ["cover.jpg", "cover.png", "folder.jpg", "folder.png", `${baseName}.jpg`, `${baseName}.png`];
          
                      for (const cov of possibleCovers) 
                      {
                          const covPath = path.join(currentPath, cov);
                          if (fs.existsSync(covPath)) 
                          {
                              cover = path.relative(".", covPath).replace(/\\/g, "/");
                              break;
                          }
                      }

                      if (!cover) 
                      {
                          cover = "music/default.png";
                      }

                      musicList.push({
                          artist: artist || "Unknown Artist",
                          album: album || "Unknown Album",
                          title: baseName.replace(/_/g, " "),
                          file: path.relative(".", fullPath).replace(/\\/g, "/"),
                          cover: cover
                      });
                  }
              }
          }

          scanDir(musicRootDir);

          fs.writeFileSync("music-data.json", JSON.stringify(musicList, null, 2));
          console.log("music-data.json successfully generated by folders!");
          '

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add music-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update music-data.json from folders [skip ci]" && git push)