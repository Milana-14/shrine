
name: Auto Update Music Hierarchy

on:
  push:
    paths:
      - 'music/**'
      - 'album-genres.json'
      - '.github/workflows/update-music.yml'
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate music JSON from folders
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const musicRootDir = "./music";
          const genresRegistryPath = "./album-genres.json";
          const musicList = [];

          // Load album genres registry
          let albumGenresRegistry = {};

          if (fs.existsSync(genresRegistryPath)) {
              try {
                  const raw = fs.readFileSync(genresRegistryPath, "utf8")
                      .replace(/^\uFEFF/, "");

                  const parsed = JSON.parse(raw);

                  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
                      throw new Error("album-genres.json must contain an object");
                  }

                  albumGenresRegistry = parsed;

                  console.log(
                      `Loaded ${Object.keys(albumGenresRegistry).length} album genre entries.`
                  );
              } catch (err) {
                  console.error("Failed to parse album-genres.json:", err);
                  process.exit(1);
              }
          } else {
              console.log("album-genres.json not found. Using genre.txt files only.");
          }

          let totalAlbums = 0;
          let genreTxtCount = 0;
          let registryCount = 0;
          let otherCount = 0;

          // Read artists
          if (fs.existsSync(musicRootDir)) {
              const artists = fs.readdirSync(musicRootDir, {
                  withFileTypes: true
              });

              for (const entry of artists) {
                  if (!entry.isDirectory()) continue;

                  const artistObj = {
                      artist: entry.name,
                      albums: []
                  };

                  const artistPath = path.join(musicRootDir, entry.name);
                  const albums = fs.readdirSync(artistPath, {
                      withFileTypes: true
                  });

                  for (const albumEntry of albums) {
                      if (!albumEntry.isDirectory()) continue;

                      const albumPath = path.join(artistPath, albumEntry.name);
                      const album = albumEntry.name;

                      const tracks = fs.readdirSync(albumPath, {
                          withFileTypes: true
                      })
                          .filter(file =>
                              file.isFile() &&
                              file.name.toLowerCase().endsWith(".mp3")
                          )
                          .map(file => {
                              const baseName = path.basename(
                                  file.name,
                                  path.extname(file.name)
                              );

                              return {
                                  title: baseName.replace(/_/g, " "),
                                  file: path.relative(
                                      ".",
                                      path.join(albumPath, file.name)
                                  ).replace(/\\/g, "/")
                              };
                          });

                      if (tracks.length === 0) continue;

                      // Find album cover
                      let cover = null;

                      const possibleCovers = [
                          "cover.jpg",
                          "cover.png",
                          "folder.jpg",
                          "folder.png"
                      ];

                      for (const cov of possibleCovers) {
                          const covPath = path.join(albumPath, cov);

                          if (fs.existsSync(covPath)) {
                              cover = path.relative(".", covPath)
                                  .replace(/\\/g, "/");
                              break;
                          }
                      }

                      if (!cover) {
                          cover = "music/default.png";
                      }

                      // Determine album genres
                      let genres = ["other"];

                      const genreFilePath = path.join(albumPath, "genre.txt");
                      const registryKey = `${entry.name}/${album}`;

                      // Priority 1: genre.txt
                      if (fs.existsSync(genreFilePath)) {
                          const rawGenre = fs.readFileSync(
                              genreFilePath,
                              "utf8"
                          ).replace(/^\uFEFF/, "").trim();

                          if (rawGenre) {
                              genres = rawGenre
                                  .split(",")
                                  .map(g => g.trim().toLowerCase())
                                  .filter(Boolean);

                              genreTxtCount++;
                          } else {
                              console.log(`Empty genre.txt: ${registryKey}`);
                              otherCount++;
                          }
                      }

                      // Priority 2: album-genres.json
                      else if (
                          Array.isArray(albumGenresRegistry[registryKey])
                      ) {
                          const normalized = albumGenresRegistry[registryKey]
                              .map(g => String(g).trim().toLowerCase())
                              .filter(Boolean);

                          if (normalized.length > 0 &&
                              !(normalized.length === 1 && normalized[0] === "other")) {
                              genres = normalized;
                              registryCount++;
                          } else {
                              otherCount++;
                          }
                      } else {
                          otherCount++;
                      }

                      // Extract year
                      const yearMatch = album.match(/\b(19|20)\d{2}\b/);

                      artistObj.albums.push({
                          title: album,
                          year: yearMatch ? Number(yearMatch[0]) : null,
                          genres: genres,
                          cover: cover,
                          tracks: tracks
                      });

                      totalAlbums++;
                  }

                  if (artistObj.albums.length > 0) {
                      musicList.push(artistObj);
                  }
              }
          } else {
              console.error("Music directory not found!");
              process.exit(1);
          }

          // Generate music-data.json
          fs.writeFileSync(
              "music-data.json",
              JSON.stringify(musicList, null, 2) + "\n"
          );

          console.log("--------------------------------");
          console.log("Music JSON successfully generated!");
          console.log(`Artists: ${musicList.length}`);
          console.log(`Albums: ${totalAlbums}`);
          console.log(`Genres from genre.txt: ${genreTxtCount}`);
          console.log(`Genres from registry: ${registryCount}`);
          console.log(`Albums with other: ${otherCount}`);
          console.log("--------------------------------");
          NODE

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git add music-data.json

          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto-update music-data.json from folders [skip ci]"
            git push
          )
