
name: Auto Update Art Gallery

on:
  push:
    paths:
      - 'art/**'
      - '.github/workflows/update-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-art-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate art JSON
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();
          const artRoot = path.join(root, 'art');
          const output = path.join(root, 'art-data.json');

          const extensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];
          const preferred = [
            'cover.jpg', 'cover.jpeg', 'cover.png', 'cover.webp',
            'portrait.jpg', 'portrait.jpeg', 'portrait.png', 'portrait.webp',
            'art.jpg', 'art.png', 'drawing.png', 'image.webp'
          ];

          if (!fs.existsSync(artRoot)) {
            throw new Error('The art/ directory does not exist!');
          }

          const artworks = [];

          function scan(dir) {
            const entries = fs.readdirSync(dir, { withFileTypes: true });

            const images = entries
              .filter(e => e.isFile() &&
                extensions.includes(path.extname(e.name).toLowerCase()))
              .map(e => e.name)
              .sort((a, b) => a.localeCompare(b));

            if (dir !== artRoot && images.length > 0) {
              const folderName = path.basename(dir);

              const preferredImage = preferred.find(name =>
                images.some(img => img.toLowerCase() === name)
              );

              const imageName = preferredImage || images[0];

              const descriptionPath = path.join(dir, 'description.txt');

              const materials = fs.existsSync(descriptionPath)
                ? fs.readFileSync(descriptionPath, 'utf8').trim()
                : 'Graphite pencil';

              const yearMatch = folderName.match(/\b(19|20)\d{2}\b/);

              const imagePath = path.relative(
                root,
                path.join(dir, imageName)
              ).split(path.sep).join('/');

              artworks.push({
                title: folderName,
                year: yearMatch ? Number(yearMatch[0]) : null,
                materials: materials || 'Graphite pencil',
                image: imagePath
              });

              console.log('Found artwork:', folderName, '->', imagePath);
            }

            for (const entry of entries) {
              if (entry.isDirectory()) {
                scan(path.join(dir, entry.name));
              }
            }
          }

          scan(artRoot);

          if (artworks.length === 0) {
            throw new Error(
              'No artworks found! art-data.json was NOT overwritten.'
            );
          }

          artworks.sort((a, b) => a.title.localeCompare(b.title));

          fs.writeFileSync(
            output,
            JSON.stringify(artworks, null, 2) + '\n'
          );

          console.log(`Successfully generated ${artworks.length} artworks!`);
          NODE

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add art-data.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update art-data.json [skip ci]"
            git push
          else
            echo "No changes in art-data.json"
          fi
