<!DOCTYPE html>
<html lang="en" xmlns:color="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>♡ Mila ♡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-wrapper">

    <header class="site-header">
        <h1>❤︎ My Music Collection ♡</h1>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
            <a href="index.html" style="color: #00eaff;"><-- Main page</a>

            <div class="view-switcher">
                <span style="font-size: 13px; color: #ff4d9d;">★ View:</span>
                <button id="btn-detailed" class="retro-btn active" onclick="switchView('detailed')">[ Detailed ]</button>
                <button id="btn-shelf" class="retro-btn" onclick="switchView('shelf')">[ Summary ]</button>
            </div>
        </div>
    </header>

    <main class="main-content" style="padding: 20px;">

        <div id="music-container">
            <p style="color: #888;">Loading...</p>
        </div>

    </main>

    <footer class="site-footer">
        <p>14.11.2026 | Made by me (Mila) bc I was rly bored</p>
    </footer>

</div>

<img src="images/flower_3.jpe" alt="I Love You" class="floating-sticker_13">
<img src="images/gerard_2.jpe" alt="I Love You" class="floating-sticker_2">
<img src="images/cat_1.png" alt="I Love You" class="floating-sticker_4">
<img src="images/mic.png" alt="I Love You" class="floating-sticker_5">
<img src="images/cat_2.png" alt="I Love You" class="floating-sticker_6">
<img src="images/clouds.png" alt="I Love You" class="floating-sticker_8">
<img src="images/flower_1.png" alt="I Love You" class="floating-sticker_9">
<img src="images/cat_3.png" alt="I Love You" class="floating-sticker_7">
<img src="images/flower_2.png" alt="I Love You" class="floating-sticker_10">
<img src="images/gerard_3.jpe" alt="I Love You" class="floating-sticker_14">
<img src="images/cat_4.png" alt="I Love You" class="floating-sticker_15">
<img src="images/cat_5.png" alt="I Love You" class="floating-sticker_16">

<script>
    let globalMusicData = [];
    let currentView = 'detailed';

    function switchView(view) {
        currentView = view;

        document.getElementById('btn-detailed').classList.toggle('active', view === 'detailed');
        document.getElementById('btn-shelf').classList.toggle('active', view === 'shelf');

        renderMusicData();
    }

    fetch('music-data.json')
        .then(response => response.json())
        .then(data => {
            globalMusicData = data;
            renderMusicData();
        })
        .catch(error => {
            console.error('Music loading error:', error);
            document.getElementById('music-container').innerHTML = '<p style="color: red;">Failed to load the music database :(</p>';
        });

    function renderMusicData() {
        const container = document.getElementById('music-container');
        container.innerHTML = '';

        if (currentView === 'detailed') {
            globalMusicData.forEach(artistObj => {
                let artistSection = document.createElement('div');
                artistSection.className = 'box';
                artistSection.innerHTML = `<h2 style="color: #ff4d9d;">★ ${artistObj.artist}</h2>`;

                artistObj.albums.forEach(album => {
                    let albumDiv = document.createElement('div');
                    albumDiv.className = 'album-card';

                    let sortedTracks = album.tracks.sort((a, b) => {
                        let numA = parseInt(a.title) || 0;
                        let numB = parseInt(b.title) || 0;
                        return numA - numB;
                    });

                    let tracksHtml = sortedTracks.map(track => `
                        <div class="track-row">
                            <span class="track-title" title="${track.title}">${track.title}</span>
                            <div class="custom-player-wrapper">
                                <audio data-src="${track.file}" preload="none"></audio>
                                <button class="retro-play-btn" onclick="togglePlay(this)">▶</button>
                                <div class="player-controls-box">
                                    <input type="range" class="retro-slider" value="0" max="100" step="0.1" oninput="seekAudio(this)" onchange="seekAudio(this)">
                                    <span class="retro-time">00:00 / --:--</span>
                                </div>
                            </div>
                        </div>
                    `).join('');

                    let cleanAlbumTitle = album.title.replace(/\s*\(\d{4}\)|\s*\b\d{4}\b/g, '').trim();
                    let albumYearText = album.year ? `(${album.year})` : '';
                    let randomAngle = Math.floor(Math.random() * 360);

                    albumDiv.innerHTML = `
                        <div class="album-art-container">
                            <img src="images/rolling_disk.png" alt="rolling_disk" class="rolling-disk" style="--start-angle: ${randomAngle}deg;">
                            <img src="${album.cover}" alt="${cleanAlbumTitle}" class="album-cover">
                        </div>
                        <div class="album-info">
                            <h3 class="album-title">${cleanAlbumTitle} <span class="album-year">${albumYearText}</span></h3>
                            <div class="tracks-container">
                                ${tracksHtml}
                            </div>
                        </div>
                    `;

                    const disk = albumDiv.querySelector('.rolling-disk');
                    const audios = albumDiv.querySelectorAll('audio');

                    audios.forEach(audio => {
                        audio.addEventListener('play', () => {
                            document.querySelectorAll('audio').forEach(otherAudio => {
                                if (otherAudio !== audio) otherAudio.pause();
                            });
                            disk.classList.add('spinning');
                        });

                        audio.addEventListener('pause', () => {
                            let isAnyPlaying = Array.from(audios).some(a => !a.paused);
                            if (!isAnyPlaying) {
                                disk.classList.remove('spinning');
                            }
                        });
                    });

                    artistSection.appendChild(albumDiv);
                });

                container.appendChild(artistSection);
            });

        } else {
            globalMusicData.forEach(artistObj => {
                let artistSection = document.createElement('div');
                artistSection.className = 'box';
                artistSection.innerHTML = `<h2 style="color: #ff4d9d;">★ ${artistObj.artist}</h2>`;

                let shelfContainer = document.createElement('div');
                shelfContainer.className = 'shelf-container';

                artistObj.albums.forEach(album => {
                    let cleanAlbumTitle = album.title.replace(/\s*\(\d{4}\)|\s*\b\d{4}\b/g, '').trim();
                    let albumYearText = album.year ? `(${album.year})` : '';

                    let albumCard = document.createElement('div');
                    albumCard.className = 'shelf-album-card';
                    albumCard.innerHTML = `
                        <img src="${album.cover}" alt="${cleanAlbumTitle}">
                        <p class="shelf-album-title" title="${cleanAlbumTitle}">${cleanAlbumTitle}</p>
                        <span class="shelf-album-year">${albumYearText}</span>
                    `;
                    shelfContainer.appendChild(albumCard);
                });

                artistSection.appendChild(shelfContainer);
                container.appendChild(artistSection);
            });
        }
    }
</script>

<script>
    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        let m = Math.floor(seconds / 60);
        let s = Math.floor(seconds % 60);
        return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
    }

    function togglePlay(btn) {
        const row = btn.closest('.track-row');
        const audio = row.querySelector('audio');
        const slider = row.querySelector('.retro-slider');
        const timeDisplay = row.querySelector('.retro-time');
        const albumCard = btn.closest('.album-card');
        const disk = albumCard ? albumCard.querySelector('.rolling-disk') : null;

        if (!audio.getAttribute('src') && audio.getAttribute('data-src')) {
            audio.setAttribute('src', audio.getAttribute('data-src'));
            audio.load();
        }

        document.querySelectorAll('audio').forEach(a => {
            if (a !== audio) {
                a.pause();
                a.currentTime = 0;
                let otherRow = a.closest('.track-row');
                if (otherRow) {
                    let otherBtn = otherRow.querySelector('.retro-play-btn');
                    if (otherBtn) otherBtn.textContent = '▶';
                    let otherTime = otherRow.querySelector('.retro-time');
                    if (otherTime && a.duration) {
                        otherTime.textContent = `00:00 / ${formatTime(a.duration)}`;
                    }
                }
            }
        });

        document.querySelectorAll('.rolling-disk').forEach(d => d.classList.remove('spinning'));

        if (audio.paused) {
            audio.play();
            btn.textContent = '❚❚';
            if (disk) disk.classList.add('spinning');
        } else {
            audio.pause();
            btn.textContent = '▶';
            if (disk) disk.classList.remove('spinning');
        }

        audio.onloadedmetadata = () => {
            timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        };

        audio.ontimeupdate = () => {
            if (audio.duration) {
                let progress = (audio.currentTime / audio.duration) * 100;
                slider.value = progress;
                timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
            }
        };

        audio.onended = () => {
            btn.textContent = '▶';
            slider.value = 0;
            if (audio.duration) {
                timeDisplay.textContent = `00:00 / ${formatTime(audio.duration)}`;
            }
            if (disk) disk.classList.remove('spinning');
        };
    }

    function seekAudio(slider) {
        const row = slider.closest('.track-row');
        const audio = row.querySelector('audio');
        const timeDisplay = row.querySelector('.retro-time');

        if (!audio.getAttribute('src') && audio.getAttribute('data-src')) {
            audio.setAttribute('src', audio.getAttribute('data-src'));
            audio.load();
        }

        if (audio.duration) {
            let seekTime = (slider.value / 100) * audio.duration;
            audio.currentTime = seekTime;
            timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        }
    }
</script>

</body>
</html>
